<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 500 500"
    width="500"
    height="500"
>

    <defs>

        <!-- Animated Gradient -->
        <linearGradient
            id="yayaGradient"
            x1="0%"
            y1="0%"
            x2="100%"
            y2="100%"
        >

            <stop offset="0%" stop-color="#0066ff">
                <animate
                    attributeName="stop-color"
                    values="#0066ff;#8a2be2;#20d64a;#ffd500;#0066ff"
                    dur="6s"
                    repeatCount="indefinite"
                />
            </stop>

            <stop offset="50%" stop-color="#8a2be2">
                <animate
                    attributeName="stop-color"
                    values="#8a2be2;#20d64a;#ffd500;#0066ff;#8a2be2"
                    dur="6s"
                    repeatCount="indefinite"
                />
            </stop>

            <stop offset="100%" stop-color="#ffd500">
                <animate
                    attributeName="stop-color"
                    values="#ffd500;#0066ff;#8a2be2;#20d64a;#ffd500"
                    dur="6s"
                    repeatCount="indefinite"
                />
            </stop>

        </linearGradient>


        <!-- Glow -->
        <filter
            id="glow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%"
        >

            <feGaussianBlur
                stdDeviation="8"
                result="blur"
            />

            <feMerge>

                <feMergeNode
                    in="blur"
                />

                <feMergeNode
                    in="SourceGraphic"
                />

            </feMerge>

        </filter>


        <!-- Strong Glow -->
        <filter
            id="strongGlow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%"
        >

            <feGaussianBlur
                stdDeviation="14"
                result="blur"
            />

            <feMerge>

                <feMergeNode
                    in="blur"
                />

                <feMergeNode
                    in="SourceGraphic"
                />

            </feMerge>

        </filter>

    </defs>


    <!-- =====================================================
         OUTER RING
    ====================================================== -->

    <circle
        cx="250"
        cy="250"
        r="205"
        fill="none"
        stroke="url(#yayaGradient)"
        stroke-width="8"
        opacity="0.8"
        filter="url(#glow)"
    >

        <animateTransform
            attributeName="transform"
            type="rotate"
            from="0 250 250"
            to="360 250 250"
            dur="8s"
            repeatCount="indefinite"
        />

    </circle>


    <!-- =====================================================
         SECOND RING
    ====================================================== -->

    <circle
        cx="250"
        cy="250"
        r="175"
        fill="none"
        stroke="white"
        stroke-width="2"
        stroke-dasharray="12 18"
        opacity="0.35"
    >

        <animateTransform
            attributeName="transform"
            type="rotate"
            from="360 250 250"
            to="0 250 250"
            dur="5s"
            repeatCount="indefinite"
        />

    </circle>


    <!-- =====================================================
         YAYA Y
    ====================================================== -->

    <text
        x="250"
        y="330"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="260"
        font-weight="900"
        fill="url(#yayaGradient)"
        filter="url(#strongGlow)"
    >
        Y

        <!-- Pulsing -->
        <animate
            attributeName="opacity"
            values="0.85;1;0.85"
            dur="2s"
            repeatCount="indefinite"
        />

    </text>


    <!-- =====================================================
         ORBIT PARTICLE 1
    ====================================================== -->

    <g>

        <circle
            cx="250"
            cy="45"
            r="12"
            fill="#ffffff"
            filter="url(#glow)"
        />

        <animateTransform
            attributeName="transform"
            type="rotate"
            from="0 250 250"
            to="360 250 250"
            dur="3s"
            repeatCount="indefinite"
        />

    </g>


    <!-- =====================================================
         ORBIT PARTICLE 2
    ====================================================== -->

    <g>

        <circle
            cx="250"
            cy="455"
            r="10"
            fill="#ffffff"
            filter="url(#glow)"
        />

        <animateTransform
            attributeName="transform"
            type="rotate"
            from="360 250 250"
            to="0 250 250"
            dur="4s"
            repeatCount="indefinite"
        />

    </g>


    <!-- =====================================================
         SMALL ENERGY PARTICLES
    ====================================================== -->

    <circle
        cx="105"
        cy="150"
        r="6"
        fill="#0066ff"
        filter="url(#glow)"
    >

        <animate
            attributeName="opacity"
            values="0.2;1;0.2"
            dur="1.5s"
            repeatCount="indefinite"
        />

    </circle>


    <circle
        cx="395"
        cy="350"
        r="6"
        fill="#20d64a"
        filter="url(#glow)"
    >

        <animate
            attributeName="opacity"
            values="1;0.2;1"
            dur="2s"
            repeatCount="indefinite"
        />

    </circle>


    <circle
        cx="390"
        cy="135"
        r="5"
        fill="#ffd500"
        filter="url(#glow)"
    >

        <animate
            attributeName="opacity"
            values="0.2;1;0.2"
            dur="1.8s"
            repeatCount="indefinite"
        />

    </circle>


    <circle
        cx="110"
        cy="360"
        r="5"
        fill="#8a2be2"
        filter="url(#glow)"
    >

        <animate
            attributeName="opacity"
            values="1;0.2;1"
            dur="2.2s"
            repeatCount="indefinite"
        />

    </circle>

</svg>
